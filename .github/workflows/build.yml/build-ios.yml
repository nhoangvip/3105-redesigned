name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q *.zip -d source
          find source -type f -maxdepth 3 | head -50

      - name: Find Xcode project
        run: |
          find source -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build unsigned app
        run: |
          PROJECT=$(find source -name "*.xcodeproj" | head -1)
          xcodebuild \
            -project "$PROJECT" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Unsigned
          path: app-unsigned.ipa
