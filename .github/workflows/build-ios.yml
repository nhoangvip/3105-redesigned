name: Build 3105 Cyberpunk IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile iOS ARM64 Binary (3105)
        run: |
          mkdir -p Payload/3105.app
          xcrun -sdk iphoneos swiftc ViewController.swift \
            -target arm64-apple-ios15.0 \
            -o Payload/3105.app/3105

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Payload/3105.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>3105</string>
              <key>CFBundleIdentifier</key>
              <string>com.cyberpunk.patcher3105</string>
              <key>CFBundleName</key>
              <string>3105</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Fake Sign & Package IPA
        run: |
          brew install ldid
          ldid -S Payload/3105.app/3105
          zip -r9 3105_Cyberpunk_ProMax.ipa Payload

      - name: Upload 3105 Cyberpunk IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105_Cyberpunk_ProMax_IPA
          path: 3105_Cyberpunk_ProMax.ipa
          
